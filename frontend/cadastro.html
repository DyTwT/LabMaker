<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro LabMaker</title>
    <link rel="stylesheet" href="cadlog.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="cadlog.js" defer></script>
</head>

<body>
    <section>
        <form class="formulario_login">
            <input type="hidden" name="action" value="cadastro">

            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome aqui" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

            <label for="senha">Senha:</label>
            <div class="input-container">
                <input type="password" id="senha_cad" name="senha" placeholder="************" required>
                <span class="material-icons toggle-senha" onclick="toggleSenha('senha_cad', this)">
                    visibility_off
                </span>
            </div>

            <button type="submit">Cadastrar</button>
        </form>
        <p>Já possui uma conta? <a href="login.html">Faça login</a></p>
    </section>
</body>

</html>
