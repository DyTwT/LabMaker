<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login LabMaker</title>
    <link rel="stylesheet" href="cadlog.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="cadlog.js" defer></script>
</head>

<body>
    <section>
        <form class="formulario_login">
            <input type="hidden" name="action" value="login">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

            <label for="senha">Senha:</label>
            <div class="input-container">
                <input type="password" id="senha" name="senha" placeholder="************" required>
                <span class="material-icons toggle-senha" onclick="toggleSenha('senha', this)">
                    visibility_off
                </span>
            </div>

            <button type="submit">Login</button>
        </form>
        <p>Não possui uma conta? <a href="cadastro.html">Cadastre-se</a></p>
    </section>
</body>

</html>
